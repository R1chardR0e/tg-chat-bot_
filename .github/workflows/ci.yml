name: Проверка проекта

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Код и тесты
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Установить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить зависимости
        run: python -m pip install -r requirements-dev.txt

      - name: Проверить код
        run: ruff check .

      - name: Проверить форматирование
        run: ruff format --check .

      - name: Проверить компиляцию
        run: python -m compileall -q api database embeddings handlers scripts utils bot.py config.py

      - name: Запустить тесты
        run: python -m pytest
